services:
  api:
    image: sadafiqbal22/mid-svc:56352
    ports:
      - "9052:5000"          # host 9052 -> container port (change 5000 if your app uses another port)
    environment:
      STUDENT: "56352"
      REDIS_HOST: store
    depends_on:
      - store
    networks:
      - backend-56352

  store:
    image: redis:alpine
    command: redis-server --appendonly yes --dir /data
    volumes:
      - store-56352:/data
    networks:
      - backend-56352

networks:
  backend-56352:

volumes:
  store-56352: